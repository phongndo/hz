[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Fast terminal workspace manager for parallel development with agents."
repository = "https://github.com/phongndo/hz"
keywords = ["ai", "agents", "cli", "terminal", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs2 = "0.4"
getrandom = "0.2.17"
libc = "0.2"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
ulid = "1.2"
walkdir = "2.5"
winapi-util = "0.1"

hz-core = { path = "crates/hz-core" }
hz-command = { path = "crates/hz-command" }
hz-git = { path = "crates/hz-git" }
hz-hg = { path = "crates/hz-hg" }
hz-scm = { path = "crates/hz-scm" }
hz-workspace = { path = "crates/hz-workspace" }
