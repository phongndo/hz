name: Release

# Publishes CMakeLists.txt's version when a push to main carries one that has no release yet
# (see "Releases" in CONTRIBUTING.md), once that commit's ci and Distribution runs pass. The
# release carries the archives Distribution built and tested for that commit; the Installs
# workflow then installs it the ways the README documents. Running it by hand retries a failed
# release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash # with pipefail, unlike the default shell

jobs:
  version:
    name: Find an unreleased version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 scripts/dist.py version)
          if [[ $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null) == false ]]; then
            echo "$tag is already released; bump the version in CMakeLists.txt to release again."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the commit and wait for its ci and Distribution runs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not a commit on main"
            exit 1
          fi
          if tagged=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}") && [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG already points to $tagged, not $GITHUB_SHA"
            exit 1
          fi
          for workflow in ci.yml distribution.yml; do
            # The push that started this run started those too; give them time to appear.
            for _ in {1..30}; do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
                --jq '.workflow_runs[0].id // empty')
              [[ -n "$run" ]] && break
              sleep 10
            done
            if [[ -z "$run" ]]; then
              echo "::error::$workflow has not run for main at $GITHUB_SHA"
              exit 1
            fi
            if ! gh run watch "$run" --exit-status --interval 60 > /dev/null; then
              echo "::error::$workflow failed for $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
              exit 1
            fi
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "distribution=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.distribution }}
          pattern: hz-*
          path: dist
          merge-multiple: true

      - name: Verify the archives and write the Homebrew formula
        run: |
          [[ $(find dist -name '*.tar.gz' | wc -l) -eq 3 ]]
          (cd dist && sha256sum --check ./*.sha256)
          python3 scripts/dist.py formula --checksums dist --output dist/hz-cli.rb
          ruby -c dist/hz-cli.rb
          cp scripts/install.sh dist/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Builds for Apple Silicon macOS 14+ and for x86_64 and ARM64 Linux (static, any
          distribution). Install with one of these, then update with \`hz update\`. See
          [Installation](https://github.com/phongndo/hz/blob/main/docs/installation.md).

          Homebrew:

          \`\`\`sh
          brew install phongndo/tap/hz-cli
          \`\`\`

          Install script:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/phongndo/hz/main/scripts/install.sh | sh
          \`\`\`

          mise:

          \`\`\`sh
          mise use -g github:phongndo/hz
          \`\`\`

          Nix:

          \`\`\`sh
          nix profile add github:phongndo/hz/$TAG
          \`\`\`

          EOF
          # Assets go up while the release is a draft: a published release can't change.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [[ "$draft" != true ]]; then
              echo "::error::$TAG is already published; release a new version instead"
              exit 1
            fi
            # A draft left by an earlier attempt may have been for another commit.
            gh release edit "$TAG" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "hz ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Tell the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN; the tap picks up $TAG on its next hourly update."
            exit 0
          fi
          gh api --method POST repos/phongndo/homebrew-tap/dispatches \
            -f event_type=hz-release -f "client_payload[release_tag]=$TAG"

  installs:
    needs: publish
    uses: ./.github/workflows/installs.yml
