name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      integration: ${{ steps.classify.outputs.integration }}
      performance: ${{ steps.classify.outputs.performance }}
      workflows: ${{ steps.classify.outputs.workflows }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test CI helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Classify impacted lanes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci/changes.py

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
          cache: false

      - name: Install actionlint
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color

  rust:
    name: Rust correctness
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run Rust suite
        run: scripts/ci/rust

  msrv:
    name: MSRV (Rust 1.85)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.85"

      - name: Restore MSRV cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  integration:
    name: CLI and installer integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh

      - name: Run integration suite
        run: scripts/ci/integration

  performance:
    name: Deterministic benchmark smoke
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Run benchmark smoke
        run: scripts/ci/performance smoke

  gate:
    name: CI gate
    needs:
      - changes
      - workflow-lint
      - rust
      - msrv
      - integration
      - performance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every selected lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKFLOW_SELECTED: ${{ needs.changes.outputs.workflows }}
          WORKFLOW_RESULT: ${{ needs.workflow-lint.result }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          INTEGRATION_SELECTED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PERFORMANCE_SELECTED: ${{ needs.changes.outputs.performance }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::change classification ended with $CHANGES_RESULT"
            exit 1
          fi

          failed=0
          for entry in \
            "workflow-lint:$WORKFLOW_SELECTED:$WORKFLOW_RESULT" \
            "rust:$RUST_SELECTED:$RUST_RESULT" \
            "msrv:$RUST_SELECTED:$MSRV_RESULT" \
            "integration:$INTEGRATION_SELECTED:$INTEGRATION_RESULT" \
            "performance:$PERFORMANCE_SELECTED:$PERFORMANCE_RESULT"
          do
            name="${entry%%:*}"
            remainder="${entry#*:}"
            selected="${remainder%%:*}"
            result="${remainder#*:}"
            if [[ "$selected" == true && "$result" != success ]]; then
              echo "::error::$name was selected but ended with $result"
              failed=1
            elif [[ "$selected" != true && "$result" != skipped && "$result" != success ]]; then
              echo "::error::$name unexpectedly ended with $result"
              failed=1
            fi
          done
          exit "$failed"
